# Model Profiles Configuration
# Per-family templates, sampling settings, and quirks for the refinement
# pipeline. Resolved by app/model_profiles.py: exact model entry → family
# → generic defaults.
#
# Sources (official model cards / docs):
#   - DeepSeek-R1 & distills: temperature 0.5-0.7 (0.6 recommended), top_p 0.95,
#     NO system prompt (all instructions in the user prompt), enforce output
#     starts with  Turnbull.
#   - Qwen2.5-Coder: ChatML, system prompt "You are Qwen, created by Alibaba
#     Cloud. You are a helpful assistant.", temp 0.7 / top_p 0.8 / top_k 20,
#     128K context with YaRN.
#   - Qwen3: hybrid thinking; /no_think soft switch; non-thinking rec temp 0.7,
#     top_p 0.8, top_k 20, min_p 0; thinking rec temp 0.6, top_p 0.95.
#   - SmolLM2-1.7B-Instruct: temp 0.2, top_p 0.9; strong at rewriting; English-only.
#   - prism-ml Ternary-Bonsai: 2-bit ternary Qwen3-lineage (on-device) — treated
#     as experimental.
# Community fine-tunes (synapse-*, fable) are marked experimental: true.

defaults:
  temperature: 0.7
  top_p: 0.9
  # Ollama's own default context; hardware-aware clamping (model_profiles.py)
  # further reduces this on low-RAM machines.
  num_ctx: 4096
  num_predict: 2048
  use_system_role: true

families:
  deepseek_r1:
    description: "DeepSeek-R1 reasoning family (incl. Qwen/Llama distills)."
    temperature: 0.6
    top_p: 0.95
    use_system_role: false
    num_predict: 4096
    extra_system_directives: |
      Begin your reply with <think>, reason step by step inside the thinking
      block, then close it and output the refined prompt only.
    quirks:
      - "Emits a reasoning block (its native think tags) before the final answer; the pipeline strips them afterwards."
      - "Official guidance: temperature 0.5-0.7 (0.6 recommended), top_p 0.95."
      - "No system prompt: all instructions must live in the user message."
      - "Avoid heavy few-shot examples; keep the refinement directive explicit."

  qwen25_coder:
    description: "Qwen2.5-Coder family (code-specialized)."
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    extra_system_directives: |
      You are Qwen, created by Alibaba Cloud. You are a helpful assistant.
    quirks:
      - "Excellent at code and structured output; long-context capable."
      - "Official generation settings: temp 0.7, top_p 0.8, top_k 20, repetition_penalty ~1.05."

  qwen25:
    description: "Qwen2.5 general instruct family."
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    extra_system_directives: |
      You are Qwen, created by Alibaba Cloud. You are a helpful assistant.
    quirks:
      - "Solid instruction following at small sizes; keep requests concrete."

  qwen3:
    description: "Qwen3 hybrid thinking / non-thinking family."
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    extra_system_directives: |
      /no_think
    quirks:
      - "Hybrid thinking model: append /no_think to disable reasoning for efficiency."
      - "Official non-thinking rec: temp 0.7, top_p 0.8, top_k 20, min_p 0."
      - "In thinking mode use temp 0.6, top_p 0.95; never greedy-decode."

  smollm2:
    description: "HuggingFace SmolLM2-1.7B-Instruct — tiny, English-only."
    temperature: 0.2
    top_p: 0.9
    num_predict: 1024
    quirks:
      - "Small model: keep instructions short, explicit, and direct."
      - "English-only; do not request other languages."
      - "Strong at text rewriting when given a system role (per official card)."

  bonsai:
    description: "prism-ml Ternary-Bonsai (2-bit Qwen3-lineage, on-device)."
    temperature: 0.7
    top_p: 0.8
    experimental: true
    quirks:
      - "Extreme ternary quantization; treat output quality as experimental."
      - "Qwen3-lineage chat format."

  fable:
    description: "Community creative-writing fine-tune (Fable lineage)."
    temperature: 0.7
    top_p: 0.9
    experimental: true
    quirks:
      - "Storytelling-oriented fine-tune; may add narrative flourishes."
      - "Unknown provenance; verify output before relying on it."

  deepseek_ft:
    description: "Local DeepSeek-lineage fine-tune (unknown provenance)."
    temperature: 0.6
    top_p: 0.95
    use_system_role: false
    experimental: true
    quirks:
      - "Fine-tuned variant; behavior may drift from upstream DeepSeek-R1."

  llama3:
    description: "Llama 3 instruct family."
    temperature: 0.7
    top_p: 0.9
    quirks:
      - "Very chatty, tell it to be concise."
      - "Great at roleplay."

# Installed models on this machine (2026-10-26) — explicit entries so exact
# matches win; unknown future models still resolve via family patterns.
models:
  deepseek-r1:1.5b:
    family: deepseek_r1
    description: "DeepSeek-R1 1.5B distill (official Ollama tag)."
  deepseek-r1:7b:
    family: deepseek_r1
    description: "DeepSeek-R1 7B (full distill)."
  deepseek-r1-distill-qwen-1.5b-q5:latest:
    family: deepseek_r1
    description: "DeepSeek-R1-Distill-Qwen-1.5B, q5 quantization."
  deepseek-r1-distill-qwen-7b-q4_k_m:latest:
    family: deepseek_r1
    description: "DeepSeek-R1-Distill-Qwen-7B, q4_K_M quantization."
  qwen2.5-coder:0.5b:
    family: qwen25_coder
    description: "Qwen2.5-Coder 0.5B — fastest, for low-resource machines."
  qwen2.5-coder:3b:
    family: qwen25_coder
    description: "Qwen2.5-Coder 3B."
  qwen2.5-coder:7b:
    family: qwen25_coder
    description: "Qwen2.5-Coder 7B — strongest local coder on this machine."
  qwen2.5-coder-7b-instruct-q4_k_m:latest:
    family: qwen25_coder
    description: "Qwen2.5-Coder-7B-Instruct, q4_K_M quantization."
  qwen2.5:0.5b:
    family: qwen25
    description: "Qwen2.5 0.5B — RC smoke default."
  qwen3:8b:
    family: qwen3
    description: "Qwen3 8B — hybrid thinking."
  smollm2-1.7b:latest:
    family: smollm2
    description: "SmolLM2 1.7B Instruct."
  minicpm5-fable5-q4:latest:
    family: fable
    description: "Community Fable-lineage creative fine-tune (q4)."
  synapse-bonsai-8b:latest:
    family: bonsai
    description: "Synapse fine-tune of the Ternary-Bonsai 8B family."
  prism-ml_bonsai-8b-unpacked-q2_k:latest:
    family: bonsai
    description: "prism-ml Ternary-Bonsai 8B, unpacked q2_K quantization."
  synapse-deepseek-local:latest:
    family: deepseek_ft
    description: "Local Synapse DeepSeek-lineage fine-tune."
  # Profiles kept for common external models (not installed locally):
  llama3:8b:
    family: llama3
    description: "Llama 3 8B — the standard for general purpose tasks."
  tinyllama:latest:
    family: generic
    description: "TinyLlama 1.1B — extremely fast, basic formatting only."
    quirks:
      - "Keep instructions very simple; struggles with complex logic."
  phi3:mini:
    family: generic
    description: "Phi-3 Mini 3.8B — high reasoning capability, efficient."
    quirks:
      - "Excellent reasoning for its size; follows instructions well."
  glm4:9b-chat-q4_K_M:
    family: generic
    description: "GLM-4 9B — powerful multilingual model, needs high VRAM."
    quirks:
      - "Strong reasoning; can be slow on consumer hardware."
