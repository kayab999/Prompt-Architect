# Base Destructive Tests (Inmutable)
# These tests are loaded by the TribunalEngine directly and cannot be modified by the LLM.

[tests]
# Each test defines the binary/script and arguments as a list to avoid shell injection.
# Structure: { command = ["path", "arg1", "arg2"] }

